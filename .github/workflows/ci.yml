name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate install script
        run: sh -n install.sh

      - name: Install script help
        run: sh install.sh --help

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Write fixtures
        run: bun run make-fixtures

      - name: CLI fails on the bad fixture
        run: |
          if bun run src/cli.ts fixtures/bad.odt; then
            echo "::error::expected a non-zero exit for fixtures/bad.odt"
            exit 1
          fi

      - name: CLI passes on the good fixture
        run: bun run src/cli.ts fixtures/good.odt

      - name: Site assets are in sync
        run: bun run build:site && git diff --exit-code site/assets/demo.js && bun run check:site
